<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>India EV Charger Map</title>
<meta name="description" content="Every EV charging station in India — AC and DC, any type — on one map. Find chargers near you.">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map" role="application" aria-label="Map of all EV charging stations in India"></div>
<button id="locate-btn" class="locate-btn" type="button" aria-label="Find chargers near me" title="Find chargers near me">📍</button>
<button id="pick-btn" class="locate-btn pick-btn" type="button" aria-label="Pick a destination on the map" title="Pick any destination on the map">🎯</button>

<div id="trip-panel" class="trip-panel" hidden>
  <div class="trip-panel-inner">
    <div class="trip-head">
      <b>Plan EV trip</b>
      <button id="trip-close" type="button" class="trip-close" aria-label="Close">×</button>
    </div>
    <div id="trip-dest" class="trip-dest"></div>
    <label class="trip-label" for="trip-soc">Current battery (SoC %)</label>
    <input id="trip-soc" type="number" inputmode="numeric" min="5" max="100" step="1" value="80">
    <label class="trip-label" for="trip-range">Range on full charge (km)</label>
    <input id="trip-range" type="number" inputmode="numeric" min="20" max="2000" step="5" value="400">
    <p class="trip-note">Stops are planned so you arrive with ~20% battery left (you drive 80% of your range per leg).</p>
    <button id="trip-plan" type="button" class="trip-plan-btn">Plan route</button>
    <div id="trip-stops" class="trip-stops"></div>
    <div id="trip-gmaps" class="trip-gmaps"></div>
  </div>
</div>
<div id="toast" class="toast" role="alert" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="config.js"></script>
<script src="data/stations.js"></script>
<script src="app.js"></script>
</body>
</html>
